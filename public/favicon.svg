<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .brain-line { stroke: #4a4a4a; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .circuit-line { stroke: #8b9a5f; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .circuit-dot { fill: #4a4a4a; }
      .chip-main { fill: #2a2a2a; }
      .chip-shadow { fill: #1a1a1a; opacity: 0.8; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#f8f8f8"/>
  
  <!-- Left Brain Half -->
  <g transform="translate(80, 80)">
    <!-- Outer brain contour -->
    <path class="brain-line" d="M 100 40 Q 140 20 160 50 Q 170 70 160 100 Q 140 120 100 130 Q 60 120 50 100 Q 40 70 100 40 Z" stroke-width="2.5"/>
    
    <!-- Brain convolutions/wrinkles -->
    <path class="brain-line" d="M 85 60 Q 95 70 85 80"/>
    <path class="brain-line" d="M 105 55 Q 115 65 105 80"/>
    <path class="brain-line" d="M 125 60 Q 135 70 125 85"/>
    <path class="brain-line" d="M 145 70 Q 150 80 145 95"/>
    
    <path class="brain-line" d="M 70 80 Q 80 90 70 105"/>
    <path class="brain-line" d="M 90 85 Q 100 95 90 110"/>
    <path class="brain-line" d="M 110 90 Q 120 100 110 115"/>
    <path class="brain-line" d="M 130 95 Q 140 105 130 120"/>
    
    <!-- Synapses/connection dots -->
    <circle class="circuit-dot" cx="60" cy="50" r="2"/>
    <circle class="circuit-dot" cx="140" cy="45" r="2"/>
    <circle class="circuit-dot" cx="75" cy="100" r="2"/>
    <circle class="circuit-dot" cx="155" cy="105" r="2"/>
    <circle class="circuit-dot" cx="100" cy="120" r="2"/>
  </g>
  
  <!-- Right Circuit Board Half -->
  <g transform="translate(240, 80)">
    <!-- PCB main board -->
    <rect x="20" y="30" width="150" height="140" rx="10" class="brain-line" stroke-width="2.5"/>
    
    <!-- Circuit trace patterns -->
    <!-- Horizontal traces -->
    <path class="circuit-line" d="M 30 60 L 60 60 L 60 90 L 100 90 L 100 50"/>
    <path class="circuit-line" d="M 170 75 L 130 75 L 130 100 L 80 100"/>
    <path class="circuit-line" d="M 30 120 L 70 120 L 70 140 L 120 140 L 120 110"/>
    <path class="circuit-line" d="M 170 130 L 140 130 L 140 95"/>
    
    <!-- Vertical traces -->
    <path class="circuit-line" d="M 50 50 L 50 70"/>
    <path class="circuit-line" d="M 95 70 L 95 130"/>
    <path class="circuit-line" d="M 140 70 L 140 85"/>
    
    <!-- Central processor/chip (rotated square) -->
    <g transform="translate(100, 90)">
      <rect x="-18" y="-18" width="36" height="36" transform="rotate(45)" class="chip-main"/>
      <rect x="-15" y="-15" width="30" height="30" transform="rotate(45)" class="chip-shadow"/>
    </g>
    
    <!-- Smaller components around the main chip -->
    <!-- Top left capacitor -->
    <circle cx="55" cy="60" r="4" class="circuit-dot" opacity="0.8"/>
    <circle cx="55" cy="60" r="2.5" fill="#f8f8f8"/>
    
    <!-- Top right inductor -->
    <circle cx="155" cy="50" r="4" class="circuit-dot" opacity="0.8"/>
    <circle cx="155" cy="50" r="2.5" fill="#f8f8f8"/>
    
    <!-- Bottom left resistor -->
    <circle cx="40" cy="135" r="3.5" class="circuit-dot" opacity="0.8"/>
    <circle cx="40" cy="135" r="2" fill="#f8f8f8"/>
    
    <!-- Bottom right capacitor -->
    <circle cx="160" cy="140" r="3.5" class="circuit-dot" opacity="0.8"/>
    <circle cx="160" cy="140" r="2" fill="#f8f8f8"/>
    
    <!-- Via connections (small circles) -->
    <circle cx="75" cy="75" r="2" class="circuit-dot" opacity="0.6"/>
    <circle cx="125" cy="110" r="2" class="circuit-dot" opacity="0.6"/>
    <circle cx="65" cy="120" r="2" class="circuit-dot" opacity="0.6"/>
  </g>
  
  <!-- Bridge/Connection between Brain and Circuit -->
  <g>
    <!-- Connection line -->
    <path class="circuit-line" d="M 210 160 L 240 160" stroke-width="2"/>
    <!-- Connection dots -->
    <circle cx="210" cy="160" r="2.5" class="circuit-dot"/>
    <circle cx="240" cy="160" r="2.5" class="circuit-dot"/>
  </g>
</svg>
