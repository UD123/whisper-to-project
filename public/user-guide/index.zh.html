<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pose6d 用户手册</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: oklch(0.966 0.0027 264.54); --panel: #ffffff; --text: oklch(0.21 0.0338 264.36);
  --muted: oklch(0.52 0.02 264.36); --border: oklch(0.921 0.0042 264.54);
  --accent: oklch(0.5305 0.2515 263.9); --accent-soft: color-mix(in oklab, oklch(0.5305 0.2515 263.9) 9%, white);
  --code-bg: oklch(0.945 0.006 264.54); --note: oklch(0.5305 0.2515 263.9); --warn: #b26a00;
  --warn-soft: #fff4e0; --ok: #2e7d32; --ok-soft: #e7f4e8; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"] {
  --bg: #15181d; --panel: #1d2128; --text: #e3e6eb; --muted: #9aa3b0; --border: #2e343e;
  --accent: #7aa8f5; --accent-soft: #1e2d40; --code-bg: #252a33; --note: #7aa8f5; --warn: #f0b45a;
  --warn-soft: #3a2f1c; --ok: #6cc070; --ok-soft: #1f3322; --shadow: 0 1px 3px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
  font: 15px/1.6 "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, kbd { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; line-height: 1.45; }
pre code { background: none; padding: 0; }
kbd { border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }

/* layout */
.layout { display: flex; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; width: 290px; flex: 0 0 290px; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--border); padding: 18px 14px 40px; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0 4px 14px; }
.brand img { width: 34px; height: 34px; }
.brand b { font-size: 17px; display: block; }
.brand span { font-size: 12px; color: var(--muted); }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); font: inherit; margin-bottom: 6px; }
.search-info { font-size: 12px; color: var(--muted); min-height: 18px; margin: 0 4px 8px; }
.toc { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.toc ul { list-style: none; margin: 0; padding: 0 0 0 14px; }
.toc a { display: block; padding: 3px 8px; border-radius: 6px; color: var(--text); }
.toc ul a { color: var(--muted); font-size: 13px; }
.toc a:hover { background: var(--accent-soft); text-decoration: none; }
.toc a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc li.hidden { display: none; }
.theme-btn { margin-top: 18px; width: 100%; padding: 7px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); cursor: pointer; font: inherit; font-size: 13px; }
main { flex: 1; min-width: 0; padding: 28px 40px 80px; }
.content { max-width: 1040px; margin: 0 auto; }
.menu-btn { display: none; }

/* text */
h1 { font-size: 34px; line-height: 1.1; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.03em; }
h2 { font-size: 26px; margin: 52px 0 12px; padding-top: 8px; border-top: 1px solid var(--border); font-weight: 600; letter-spacing: -0.02em; }
h3 { font-size: 18px; margin: 30px 0 8px; font-weight: 600; letter-spacing: -0.01em; }
h4 { font-size: 15px; margin: 20px 0 6px; font-weight: 600; }
h2 .anchor, h3 .anchor { opacity: 0; margin-left: 6px; font-weight: 400; }
h2:hover .anchor, h3:hover .anchor { opacity: .6; }
.lead { font-size: 17px; color: var(--muted); margin: 0 0 18px; }
.meta { font-size: 13px; color: var(--muted); margin-bottom: 22px; }

/* tables */
.table-wrap { overflow-x: auto; margin: 12px 0 18px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--border); }
th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td:first-child { white-space: nowrap; }
td.wrap { white-space: normal; }

/* callouts */
.callout { border-left: 4px solid var(--note); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 14px 0; }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); }
.callout.ok { border-color: var(--ok); background: var(--ok-soft); }
.callout > b:first-child { display: block; margin-bottom: 2px; }

/* figures */
figure { margin: 16px 0 22px; }
figure img { width: 100%; height: auto; display: block; border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow); cursor: zoom-in; background: #2b2b2b; }
figure.small img { max-width: 620px; }
figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center;
  justify-content: center; z-index: 50; cursor: zoom-out; padding: 20px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 14px 0; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.card b { display: block; margin-bottom: 4px; }
.card span { font-size: 13px; color: var(--muted); }
.steps { counter-reset: s; padding-left: 0; list-style: none; }
.steps > li { counter-increment: s; position: relative; padding-left: 36px; margin: 8px 0; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; }
mark { background: #ffe36e; color: #000; border-radius: 2px; }

@media (max-width: 900px) {
  .layout { display: block; }
  .sidebar { position: fixed; z-index: 40; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  main { padding: 16px 16px 60px; }
  .menu-btn { display: inline-block; position: sticky; top: 8px; z-index: 30; margin-bottom: 10px; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
  h1 { font-size: 26px; }
  td:first-child { white-space: normal; }
}
</style>
</head>
