name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build static site (prerendered)
        run: BUILD_STATIC=true bun run build

      - name: SPA fallback for deep links
        run: cp dist/client/index.html dist/client/404.html

      # Videos/images live on the Lovable CDN at /__l5e/... — that path only
      # exists on Lovable hosting. Point those URLs at the published Lovable
      # site so they also resolve on GitHub Pages.
      - name: Rewrite Lovable CDN asset URLs to absolute
        run: |
          grep -rl '/__l5e/' dist/client --include='*.html' --include='*.js' \
            | xargs sed -i 's|"/__l5e/|"https://whisper-to-project.lovable.app/__l5e/|g'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
